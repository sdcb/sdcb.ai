name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 06:17 Asia/Shanghai — refresh stars / downloads / blog posts daily
    - cron: '17 22 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # user-writable SDK location so `dotnet workload install` needs no sudo
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../.dotnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache OCR wasm build
        id: ocr-cache
        uses: actions/cache@v4
        with:
          path: public/ocr/_framework
          key: wasm-v1-ocr-${{ runner.os }}-${{ hashFiles('ocr-wasm/*.csproj', 'ocr-wasm/*.cs', 'ocr-wasm/global.json', 'ocr-wasm/nuget.config', 'scripts/build-wasm.ts') }}

      - name: Cache GCDR wasm build
        id: gcdr-cache
        uses: actions/cache@v4
        with:
          path: public/gcdr/_framework
          key: wasm-v1-gcdr-${{ runner.os }}-${{ hashFiles('gcdr-wasm/*.csproj', 'gcdr-wasm/*.cs', 'gcdr-wasm/global.json', 'gcdr-wasm/nuget.config', 'scripts/build-wasm.ts') }}

      - name: Setup .NET
        if: steps.ocr-cache.outputs.cache-hit != 'true' || steps.gcdr-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        if: steps.ocr-cache.outputs.cache-hit != 'true' || steps.gcdr-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Install dependencies
        run: npm ci

      - name: Fetch live data
        run: npm run fetch-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCR WebAssembly playground
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        run: npm run build:ocr

      - name: Build GCDR WebAssembly playground
        if: steps.gcdr-cache.outputs.cache-hit != 'true'
        run: npm run build:gcdr

      - name: Build site
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
